twist_mux:
  ros__parameters:
    topics:
      safety:
        topic: cmd_vel_safety
        timeout: 0.2
        priority: 100
      voice:
        topic: cmd_vel_voice
        timeout: 0.5
        priority: 50
      gesture:
        topic: cmd_vel_gesture
        timeout: 0.5
        priority: 50
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10

# twist_mux zawsze publikuje wyjście na temat "cmd_vel_out" — nie ma
# parametru YAML do jego zmiany. Trzeba go zremapować przy starcie:
#   ros2 run twist_mux twist_mux --ros-args -r cmd_vel_out:=cmd_vel --params-file <ten plik>
# W robot.launch.py remapping jest już ustawiony (remappings=[('/cmd_vel_out', '/cmd_vel')]).
